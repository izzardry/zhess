<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zhess - Zero Distractions. Just Chess.</title>
    <meta name="description" content="Zero Distractions. Just Chess. A minimalist chess board for one or two players." />
    <meta name="author" content="izzardry" />

    <!--
      First paint (DESIGN 14): the theme class and the page colour are set here, before any CSS or
      script loads, so a dark system never flashes a light page. #root stays transparent until
      src/lib/boot.ts has the fonts and the first layout ready, then fades in over 300 ms. The
      animation is a fallback that reveals the page after 3 s should the script never run.
    -->
    <script>
      (function () {
        var e = document.documentElement;
        e.classList.add("zhess-booting");
        try {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) e.classList.add("dark");
        } catch (_) {}
      })();
    </script>
    <style>
      html { background-color: #fafafa; color-scheme: light; }
      html.dark { background-color: #0d0d0d; color-scheme: dark; }
      #root { transition: opacity 300ms cubic-bezier(0, 0, 0.2, 1); }
      html.zhess-booting #root { opacity: 0; animation: zhess-boot-fallback 1ms linear 3s forwards; }
      @keyframes zhess-boot-fallback { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #root { transition: none; } }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zhess" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Zhess - Zero Distractions. Just Chess." />
    <meta property="og:description" content="A minimalist chess game. 12 computer levels, serverless rooms for two, a chess clock, and zero ads." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://izzardry.github.io/zhess/" />
    <meta property="og:image" content="https://izzardry.github.io/zhess/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zhess - Zero Distractions. Just Chess." />
    <meta name="twitter:description" content="A minimalist chess game. 12 computer levels, serverless rooms for two, a chess clock, and zero ads." />
    <meta name="twitter:image" content="https://izzardry.github.io/zhess/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
